services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=http://localhost:5173
      # Alpaca credentials: source .secrets.sh in your shell before
      # `docker compose up` so these expand (never committed; see .gitignore).
      - KEY_ID=${KEY_ID}
      - SECRET=${SECRET}
    volumes:
      - ./backend/app:/app/app
      # SQLite store survives container rebuilds/restarts.
      - stocks-data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

volumes:
  stocks-data:
